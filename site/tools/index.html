<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>jessabekker.be</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Hallo<span id="name"></span>!</h1>
    <p>Hier komen onze apps.</p>
    <ul id="apps">
      <!-- e.g. <li><a href="https://boodschappen.jessabekker.be">🛒 Boodschappen</a></li> -->
    </ul>
    <p class="small">Aangemeld als <span id="email">…</span> · <a href="/oauth2/sign_out?rd=%2F">Afmelden</a></p>
  </main>
  <script>
    // oauth2-proxy tells us who signed in.
    fetch("/oauth2/userinfo")
      .then((r) => (r.ok ? r.json() : null))
      .then((u) => {
        if (!u) return;
        const name = u.preferredUsername || u.user || "";
        if (name && !name.includes("@")) document.getElementById("name").textContent = ", " + name.split(" ")[0];
        document.getElementById("email").textContent = u.email || "";
      });
  </script>
</body>
</html>
