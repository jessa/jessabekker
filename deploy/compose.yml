# The login gate for jessabekker.be: oauth2-proxy with Google sign-in and an
# allow-list of family email addresses. The shared Caddy (../server) asks it
# about every request (forward_auth) and reaches it on the "edge" network as
# jessabekker-auth:4180.
name: jessabekker

services:
  auth:
    # Security component: bump this version a few times a year (see README).
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    restart: unless-stopped
    env_file: /opt/apps/jessabekker/auth.env   # client id/secret, cookie secret
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_REDIRECT_URL: https://jessabekker.be/oauth2/callback
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      # Only the addresses in this file get in (no email-domain wildcard).
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/allowed-emails.txt
      # One sign-in covers jessabekker.be and any future *.jessabekker.be app.
      OAUTH2_PROXY_COOKIE_DOMAINS: .jessabekker.be
      OAUTH2_PROXY_WHITELIST_DOMAINS: jessabekker.be,.jessabekker.be
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_EXPIRE: 720h
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # Show Google's account chooser, handy on a shared family computer.
      OAUTH2_PROXY_PROMPT: select_account
    volumes:
      - /opt/apps/jessabekker/allowed-emails.txt:/etc/oauth2-proxy/allowed-emails.txt:ro
    networks:
      edge:
        aliases:
          - jessabekker-auth

networks:
  edge:
    external: true
